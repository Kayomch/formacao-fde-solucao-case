# Registro dos modos de persistência (#156): uma entrada por tabela que um desenho de persistência
# declarou. Fica ao lado das migrações e é versionado com elas; quem revisa persistência compara o
# que cada tabela declara com o que os adaptadores gravam nela. As chaves são em inglês; as
# descrições, em português.
#
# mode:     append-only | upsert-with-history | ephemeral
# history:  onde mora a história de uma tabela upsert (none para append-only e ephemeral)
# growth:   fixed só para tabela de consulta que só as migrações gravam
#
# Este registro nasceu com o desenho da #156 (supabase/persistence-156-return-note-emission.md) e
# declara só as tabelas dos desenhos que o tocaram: a emissão da nota de devolução (entrega 1) e o
# pedido ao fornecedor (entrega 2, supplier_contacts, outbox_supplier_emails e a sua história,
# supabase/persistence-156-supplier-requests.md). As demais tabelas das migrações ainda não têm modo
# declarado; cada uma entra aqui pelo desenho que a tocar a seguir.

database: postgresql 17 # supabase/config.toml, [db] major_version; Supabase hospedado
migrations: supabase/migrations

strategies:
  # Não há unidade de trabalho com BEGIN/COMMIT: o Worker fala com o banco só pelo PostgREST
  # (api/src/connectors/supabase-rest.ts), e cada requisição roda numa transação própria
  # (PostgREST, Transactions). Um caso de uso que grava em duas requisições é desenhado para
  # ficar correto se parar entre elas (idempotência e PATCH condicional), não por uma transação.
  # Um gatilho do banco roda dentro do comando que o dispara, então a história gravada por gatilho
  # (outbox_supplier_emails, ADR-005) continua sendo uma requisição e uma transação.
  unit_of_work: one PostgREST request per statement (api/src/connectors/supabase-rest.ts)
  tenancy:
    strategy: none # não há inquilino: um só cliente, a Já Chegou
  # Acesso: RLS ligado e nenhuma política em toda tabela; só a chave secreta do Worker lê e grava
  # (#59, AC-6). Toda tabela nova segue igual.
  row_security: enabled, no policy (#59 AC-6)
  # Nomes: ADR-001 (o que copia o kit, com o marcador -- ADR-001) e ADR-002 (literais do modelo,
  # com o marcador -- ADR-002); o resto em inglês.
  naming: [ADR-001, ADR-002]
  money: centavos em bigint (#59)

tables:
  outbox_return_notes:
    # A entrada da fila de devolução (#140). Nasce pendente e faz uma única transição, para
    # emitida ou cancelada; nenhuma escrita toca uma linha que já saiu de pendente.
    mode: upsert-with-history
    # A história fica na própria linha: o estado antes da única transição é sempre `pendente` com
    # as colunas da transição nulas, e a transição grava quem e quando (emitted_by/at ou
    # cancelled_by/at) e o que (nfe_number e a nota emitida, ou a justificativa). Não é uma das
    # formas de docs/entity-history.md; o desenho diz por quê e o que muda se a máquina de estados
    # ganhar uma segunda transição.
    history: in-row-transition # decisão em ADR-003 (a)
    # O status faz o papel de versão: só `pendente` aceita escrita, e todo PATCH filtra
    # status=eq.pendente (return-notes.ts da #140 e markEmitted da #156).
    version_column: status
    tenant: none
    indexes:
      outbox_return_notes_pkey: find e markEmitted por id (Q-E1, Q-E3); a leitura da caixa em ordem de id (Q-P3)
      outbox_return_notes_status_idx: a fila da #140 por status, em ordem de id
      outbox_return_notes_idempotency_key_key: unicidade da publicação (#59)
      outbox_return_notes_note_id_key: unicidade do nota_id emitido
      outbox_return_notes_note_access_key_key: unicidade da chave de acesso emitida
      outbox_return_notes_invoice_access_key_idx: ReturnQueueValues.valuesOf por invoice_access_key (Q-V1, #156 entrega 2); trava curta na migração (ADR-005, c)

  return_note_numbers:
    # A reserva do número da nota de devolução emitida pelo mock: o fato "o número N ficou com a
    # entrada E". Uma reserva por entrada; nunca muda.
    mode: append-only
    history: none
    tenant: none
    refusal: grant # UPDATE, DELETE e TRUNCATE revogados de anon, authenticated e service_role na migração; o cascade do reset roda como o dono (ADR-003, c)
    # Não há projeção: a reserva é lida pela própria chave (return_note_id). PER-6 não se aplica
    # a uma leitura de uma linha pelo seu fato, e o desenho diz por quê.
    projection: none
    indexes:
      return_note_numbers_pkey: unicidade do número
      return_note_numbers_return_note_id_key: árbitro do on_conflict da reserva (Q-R2), a leitura da reserva por entrada (Q-R1, Q-R3) e o cascade da exclusão da entrada

  supplier_contacts:
    # O e-mail de contato de cada fornecedor do kit (#156, entrega 2). Tabela própria, para não
    # alterar kit_fornecedores. Só as migrações gravam: a semente é a própria migração, com um
    # e-mail de teste por fornecedor (domínio .test). O Worker só lê.
    mode: append-only
    history: none
    growth: fixed # linhas só das migrações; IDX-1 e PER-6 não se aplicam
    tenant: none
    refusal: grant # INSERT, UPDATE, DELETE e TRUNCATE revogados de anon, authenticated e service_role (ADR-005, d)
    # Uma tela que edite o contato muda o modo para upsert-with-history: é um ADR que supera o ADR-005 (d).
    indexes:
      supplier_contacts_pkey: SupplierContacts.emailOf por supplier_id (Q-C1)

  outbox_supplier_emails:
    # O pedido ao fornecedor (#156, Sai 2): nasce draft ou discarded no rascunho (entrega 2); a
    # pessoa edita o texto do draft (AC-7), envia, descarta e reenvia o send_failed (entregas 3 a 5).
    # Várias transições e edições: entidade editada, com história em tabela-filha (ADR-005, a).
    mode: upsert-with-history
    history: json-child-table
    history_table: outbox_supplier_email_history # (supplier_email_id, version, changed_at, changed_by, state jsonb)
    # A história é gravada por gatilho, no mesmo comando da escrita: nenhum adaptador a grava (ADR-005, a).
    history_writer: trigger outbox_supplier_emails_history (after insert or update)
    # Todo PATCH filtra id e version=eq.N e grava version=N+1; o gatilho before update recusa
    # qualquer outra versão, então um PATCH sem o filtro também é recusado.
    version_column: version
    tenant: none
    # Dado pessoal: changed_by e sent_by guardam a identidade de quem agiu, como emitted_by na
    # outbox_return_notes. Nenhum caminho de apagamento declarado ainda (fica em aberto no desenho).
    erasure: none declared
    indexes:
      outbox_supplier_emails_pkey: leitura e PATCH condicional por id (Q-S3, Q-S4, entregas 3 e 4)
      outbox_supplier_emails_open_request_key: AC-8, unicidade parcial (invoice_access_key, request_type) where status <> 'discarded'; a recusa de save (Q-S2) chega como HTTP 409 com 23505 (ADR-005, b)
      outbox_supplier_emails_invoice_access_key_idx: SupplierRequests.listFor por invoice_access_key (Q-S1), o pedido de uma nota ou proposta em ordem de id (Q-S5, entregas 3 e 4) e o cascade da exclusão da nota

  outbox_supplier_email_history:
    # A história de outbox_supplier_emails: uma linha por escrita, com o estado inteiro depois dela.
    # Só o gatilho grava; nunca muda.
    mode: append-only
    history: none
    tenant: none
    refusal: grant # UPDATE, DELETE e TRUNCATE revogados de anon, authenticated e service_role; o cascade do reset roda como o dono (ADR-003, consequências)
    # Não é a fonte do estado atual: o estado atual é a linha de outbox_supplier_emails, gravada no
    # mesmo comando. PER-6 não se aplica; o teste online confere que a última versão da história é a linha.
    projection: none
    indexes:
      outbox_supplier_email_history_pkey: a história de um pedido em ordem de versão (Q-H1, entrega 3) e o cascade da exclusão do pedido
